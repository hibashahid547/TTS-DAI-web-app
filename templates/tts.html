{% extends "base.html" %}

{% block content %}

<div class="flex flex-col gap-2">

    <!-- =============================== -->
    <!-- Header -->
    <!-- =============================== -->

    <div>
        <h1 class="text-base font-semibold tracking-tight">
            TTS Studio
        </h1>

        <p class="mt-0.5 text-[11px] text-slate-400">
            Generate high-quality speech using your saved speaker profiles.
        </p>
    </div>


    <!-- =============================== -->
    <!-- Main Grid -->
    <!-- =============================== -->

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-2">

        <!-- ========================================= -->
        <!-- LEFT PANEL -->
        <!-- ========================================= -->

        <div class="lg:col-span-2 rounded-2xl border border-slate-800 bg-slate-900/30 p-2.5">

            <h2 class="text-sm font-semibold">
                Voice Generation
            </h2>


            <!-- Text -->

            <div class="mt-2">

                <label class="text-xs text-slate-400">
                    Enter Text
                </label>

                <textarea
                    id="tts-text"
                    rows="4"
                    class="mt-1 w-full rounded-xl bg-slate-950 border border-slate-800 px-3 py-1.5 text-sm resize-none focus:outline-none focus:ring-1 focus:ring-indigo-500"
                    placeholder="Type the text you want to convert into speech..."
                ></textarea>

                <div class="mt-0.5 text-right text-[10px] text-slate-500">
                    <span id="char-count">0</span> characters
                </div>

            </div>


            <!-- Language -->

            <div class="mt-1.5">

                <label class="text-xs text-slate-400">
                    Language
                </label>

                <select
                    id="language"
                    name="language"
                    class="mt-1 w-full rounded-xl bg-slate-950 border border-slate-800 px-2.5 py-1.5 text-xs"
                >
                    <option value="">Original Language</option>
                    <option value="English">English</option>
                    <option value="Arabic">Arabic</option>
                    <option value="Danish">Danish</option>
                    <option value="German">German</option>
                    <option value="Greek">Greek</option>
                    <option value="Spanish">Spanish</option>
                    <option value="Finnish">Finnish</option>
                    <option value="French">French</option>
                    <option value="Hebrew">Hebrew</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Italian">Italian</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Korean">Korean</option>
                    <option value="Malay">Malay</option>
                    <option value="Dutch">Dutch</option>
                    <option value="Norwegian">Norwegian</option>
                    <option value="Polish">Polish</option>
                    <option value="Portuguese">Portuguese</option>
                    <option value="Russian">Russian</option>
                    <option value="Swedish">Swedish</option>
                    <option value="Swahili">Swahili</option>
                    <option value="Turkish">Turkish</option>
                    <option value="Chinese">Chinese</option>
                </select>

            </div>


            <!-- Translate -->

            <div class="mt-1.5 flex items-center gap-1.5">

                <input
                    id="translate-first"
                    name="translate_first"
                    type="checkbox"
                    class="h-3.5 w-3.5 rounded border-slate-700 bg-slate-950 text-indigo-500"
                >

                <label
                    for="translate-first"
                    class="text-xs text-slate-300"
                >
                    Translate text before generating audio
                </label>

            </div>


            <!-- Translation -->

            <div
                id="translation-container"
                class="hidden mt-2"
            >

                <label
                    for="translated-text"
                    class="text-xs text-slate-400"
                >
                    Translated Text
                </label>

                <textarea
                    id="translated-text"
                    name="translated_text"
                    rows="2"
                    class="mt-1 w-full rounded-xl bg-slate-950 border border-slate-800 px-3 py-1.5 text-xs text-slate-100 placeholder-slate-600 resize-none focus:outline-none focus:ring-1 focus:ring-indigo-500"
                    placeholder="Translated text will appear here..."
                ></textarea>

                <div
                    id="translation-status"
                    class="mt-1 text-xs text-slate-400"
                ></div>

            </div>


            <!-- Generate -->

            <div class="mt-2">

                <button
                    id="generate-btn"
                    class="w-full rounded-xl bg-indigo-500 hover:bg-indigo-400 py-1.5 text-xs font-medium transition"
                >
                    Generate Speech
                </button>

            </div>


            <hr class="my-2 border-slate-800">


            <!-- Audio Section -->

            <div id="result-section" class="hidden">

                <div class="text-xs font-medium">
                    Generated Audio
                </div>

                <audio
                    id="audio-player"
                    controls
                    class="mt-1.5 w-full h-8"
                ></audio>

                <a
                    id="download-btn"
                    href="#"
                    download="voiceover.mp3"
                    class="mt-1.5 w-full rounded-xl bg-indigo-500 hover:bg-indigo-400 py-1.5 text-xs font-medium transition text-center block"
                >
                    Download MP3
                </a>

            </div>

        </div>


        <!-- ========================================= -->
        <!-- RIGHT PANEL -->
        <!-- ========================================= -->

        <div class="lg:col-span-1 rounded-2xl border border-slate-800 bg-slate-900/30 p-2.5">

            <h2 class="text-sm font-semibold">
                Generation Settings
            </h2>


            <!-- Speaker -->

            <div class="mt-1.5">

                <label class="text-xs text-slate-400">
                    Speaker
                </label>

                <select
                    id="speaker"
                    class="mt-1 w-full rounded-xl bg-slate-950 border border-slate-800 px-2.5 py-1.5 text-sm"
                >

                    {% for speaker in speakers %}

                    <option value="{{ speaker.name }}">
                        {{ speaker.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Emotion -->

            <div class="mt-1.5">

                <label class="text-xs text-slate-400">
                    Emotion
                </label>

                <select
                    id="emotion"
                    class="mt-1 w-full rounded-xl bg-slate-950 border border-slate-800 px-2.5 py-1.5 text-sm"
                ></select>

            </div>


            <!-- Speed -->

            <div class="mt-2.5">

                <div class="flex justify-between">

                    <label class="text-xs text-slate-400">
                        Speaking Speed
                    </label>

                    <span
                        id="speed-value"
                        class="text-xs text-indigo-300"
                    >
                        1.0x
                    </span>

                </div>

                <input
                    type="range"
                    id="speed"
                    min="0.5"
                    max="2.0"
                    step="0.25"
                    value="1.0"
                    class="mt-1 w-full accent-indigo-500"
                >

            </div>


            <hr class="my-2 border-slate-800">


            <!-- Speaker Info -->

            <div>

                <div class="text-xs font-medium">
                    Speaker Information
                </div>

                <div
                    id="speaker-info"
                    class="mt-1.5 rounded-xl border border-slate-800 bg-slate-950/50 p-2.5 text-[11px] text-slate-300"
                >
                    Select a speaker to view details.
                </div>

            </div>

        </div>

    </div>

</div>


<script>

const speakers = {{ speakers | tojson }};
const speakerEmotions = {{ speaker_emotions | tojson }};

const speakerSelect = document.getElementById("speaker");
const emotionSelect = document.getElementById("emotion");
const speakerInfo = document.getElementById("speaker-info");

const speedSlider = document.getElementById("speed");
const speedValue = document.getElementById("speed-value");

const textArea = document.getElementById("tts-text");
const charCount = document.getElementById("char-count");

const translateCheckbox = document.getElementById("translate-first");
const translationContainer = document.getElementById("translation-container");
const translatedText = document.getElementById("translated-text");
const translationStatus = document.getElementById("translation-status");

const generateBtn = document.getElementById("generate-btn");

const resultSection = document.getElementById("result-section");
const audioPlayer = document.getElementById("audio-player");
const downloadBtn = document.getElementById("download-btn");



/* ------------------------------------------
   Character Counter
------------------------------------------ */

textArea.addEventListener("input", ()=>{

    charCount.textContent = textArea.value.length;

});



/* ------------------------------------------
   Speed Slider
------------------------------------------ */

speedSlider.addEventListener("input", ()=>{

    speedValue.textContent =
        Number(speedSlider.value).toFixed(1) + "x";

});



/* ------------------------------------------
   Populate Emotion Dropdown
------------------------------------------ */

function loadEmotions(){

    emotionSelect.innerHTML = "";

    const speaker =
        speakers.find(
            s => s.name === speakerSelect.value
        );

    if(!speaker){
        return;
    }

    const emotions =
        speakerEmotions.filter(
            e => e.speaker_id === speaker.id
        );

    emotions.forEach(e=>{

        const option =
            document.createElement("option");

        option.value = e.emotion;
        option.textContent = e.emotion;

        emotionSelect.appendChild(option);

    });

}



/* ------------------------------------------
   Speaker Info
------------------------------------------ */

function updateSpeakerInfo(){

    const speaker =
        speakers.find(
            s => s.name === speakerSelect.value
        );

    if(!speaker){

        speakerInfo.innerHTML = "";
        return;

    }

    const emotions =
        speakerEmotions
        .filter(
            e => e.speaker_id === speaker.id
        )
        .map(
            e => e.emotion
        );

    speakerInfo.innerHTML = `

        <div>

            <strong>Name</strong>

            <div class="mt-0.5">
                ${speaker.name}
            </div>

        </div>

        <div class="mt-2">

            <strong>Description</strong>

            <div class="mt-0.5">
                ${speaker.description || "No description"}
            </div>

        </div>

        <div class="mt-2">

            <strong>Available Emotions</strong>

            <div class="mt-1.5 flex flex-wrap gap-1.5">

                ${
                    emotions.map(e=>`

                        <span
                            class="px-1.5 py-0.5 rounded-lg bg-indigo-500/20 border border-indigo-500/30 text-[11px]"
                        >
                            ${e}
                        </span>

                    `).join("")
                }

            </div>

        </div>

    `;

}
/* ------------------------------------------
   Initial Load
------------------------------------------ */

loadEmotions();
updateSpeakerInfo();

speakerSelect.addEventListener("change", ()=>{

    loadEmotions();
    updateSpeakerInfo();

});



/* ------------------------------------------
   Generate Speech
------------------------------------------ */

generateBtn.addEventListener("click", async () => {

    const originalText =
        textArea.value.trim();

    const isTranslationEnabled =
        translateCheckbox.checked;


    /* Validate original text */

    if (!originalText) {

        alert("Please enter text.");
        return;

    }


    /* Decide which text goes to Chatterbox */

    let textForTTS = originalText;

    if (isTranslationEnabled) {

        textForTTS =
            translatedText.value.trim();

        if (!textForTTS) {

            alert("Translated text is empty.");
            return;

        }

    }


    /* Show loader */

    TTSDAI.showLoader();


    try {

        const formData =
            new FormData();


        formData.append(
            "text",
            textForTTS
        );

        formData.append(
            "original_text",
            originalText
        );

        formData.append(
            "translated_text",
            isTranslationEnabled
                ? textForTTS
                : ""
        );

        formData.append(
            "speaker",
            speakerSelect.value
        );

        formData.append(
            "emotion",
            emotionSelect.value
        );

        formData.append(
            "speed",
            speedSlider.value
        );

        formData.append(
            "language",
            document.getElementById("language").value
        );

        formData.append(
            "translate_first",
            "false"
        );

        formData.append(
            "filename",
            "voiceover.mp3"
        );


        /* Call Generate Speech API */

        const response =
            await fetch(
                "/ui/tts/generate",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Generation failed."
            );

        }


        /* Show generated audio */

        resultSection.classList.remove("hidden");

        audioPlayer.src =
            data.public_url;

        audioPlayer.load();


        /* Download button */

        downloadBtn.href =
            `/ui/tts/download/${data.id}`;

        downloadBtn.download =
            data.filename;


    } catch (err) {

        console.error(err);

        alert(
            err.message ||
            "Generation failed."
        );

    } finally {

        TTSDAI.hideLoader();

    }

});



/* ------------------------------------------
   Translation
------------------------------------------ */

translateCheckbox.addEventListener(
    "change",
    async function () {

        /* Checkbox unchecked */

        if (!this.checked) {

            translationContainer
                .classList
                .add("hidden");

            translatedText.value = "";
            translationStatus.textContent = "";

            return;

        }


        /* Checkbox checked */

        const text =
            textArea.value.trim();

        const language =
            document
                .getElementById("language")
                .value;


        if (!text) {

            this.checked = false;

            alert(
                "Please enter text before enabling translation."
            );

            return;

        }


        if (!language) {

            this.checked = false;

            alert(
                "Please select a language before enabling translation."
            );

            return;

        }


        translationContainer
            .classList
            .remove("hidden");

        translationStatus.textContent =
            "Translating...";

        translatedText.value = "";


        try {

            const formData =
                new FormData();

            formData.append(
                "text",
                text
            );

            formData.append(
                "language",
                language
            );


            const response =
                await fetch(
                    "/ui/tts/translate",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Translation failed."
                );

            }


            translatedText.value =
                data.translated_text;


            translationStatus.textContent =
                "Translation completed. You can edit it before generating speech.";

            translationStatus.className =
                "mt-1 text-xs text-emerald-400";


        } catch (error) {

            console.error(
                "Translation error:",
                error
            );

            translationStatus.textContent =
                "Translation failed.";

            translationStatus.className =
                "mt-1 text-xs text-red-400";

            translatedText.value = "";

        }

    }
);

</script>

{% endblock %}
