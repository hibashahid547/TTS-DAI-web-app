<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "TTS-DAI" }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div id="global-loader" class="hidden fixed inset-0 z-[100] bg-slate-950/70 backdrop-blur-sm">
    <div class="h-full w-full flex items-center justify-center">
      <div class="rounded-2xl border border-slate-800 bg-slate-900/60 px-5 py-4 flex items-center gap-3">
        <div class="h-5 w-5 rounded-full border-2 border-slate-500 border-t-indigo-400 animate-spin"></div>
        <div class="text-sm text-slate-200">Processing…</div>
      </div>
    </div>
  </div>
  <div class="bg-slate-950/80 backdrop-blur border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/ui" class="font-semibold tracking-tight">TTS-DAI</a>
      <div class="flex items-center gap-2">
        <a
          href="/ui/tts"
          class="px-3 py-1.5 rounded-lg text-sm border border-slate-800 hover:bg-slate-900"
        >
          TTS Studio
        </a>

        <a
          href="/ui/history"
          class="px-3 py-1.5 rounded-lg text-sm border border-slate-800 hover:bg-slate-900"
        >
          History
        </a>

        <a
          href="/ui/speakers"
          class="px-3 py-1.5 rounded-lg text-sm border border-slate-800 hover:bg-slate-900"
        >
          Speakers Studio
        </a>

        <a
          href="/docs"
          class="px-3 py-1.5 rounded-lg text-sm border border-slate-800 hover:bg-slate-900"
        >
          API Docs
        </a>

        <!-- Sign Out -->
        <form method="post" action="/logout" class="inline">
          <button
            type="submit"
            class="px-3 py-1.5 rounded-lg text-sm border border-slate-800 text-slate-300 hover:bg-red-500/10 hover:border-red-500/40 hover:text-red-300"
          >
            Sign Out
          </button>
        </form>
      </div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% if message %}
      <div class="mb-6 rounded-xl border border-slate-800 bg-slate-900/40 px-4 py-3 text-sm">
        {{ message }}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-6xl mx-auto px-4 pb-10 text-xs text-slate-400">
    <div class="border-t border-slate-800 pt-6">
      <div>CPU-only • Chatterbox TTS • High-quality chunked synthesis</div>
    </div>
  </footer>

  <script>
    (function () {
      const loader = document.getElementById('global-loader');
      function showLoader() {
        if (loader) loader.classList.remove('hidden');
      }
      function hideLoader() {
        if (loader) loader.classList.add('hidden');
      }

      window.TTSDAI = window.TTSDAI || {};
      window.TTSDAI.showLoader = showLoader;
      window.TTSDAI.hideLoader = hideLoader;

      window.addEventListener('pageshow', hideLoader);

      document.addEventListener('submit', function (e) {
        const form = e.target;
        if (form && form.tagName === 'FORM') {
          if (form.dataset && form.dataset.ajax === 'true') return;
          showLoader();
        }
      });

      document.addEventListener('click', function (e) {
        const btn = e.target && e.target.closest ? e.target.closest('button[data-loader]') : null;
        if (btn) showLoader();
      });
    })();
  </script>
</body>
</html>
