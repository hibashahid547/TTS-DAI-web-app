<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title or "TTS-DAI • Login" }}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #020617;

            color: #f8fafc;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        /* =========================
           AUTH WRAPPER
        ========================= */

        .auth-wrapper {
            width: 100%;
            max-width: 430px;
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 54px;
            height: 54px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: #6366f1;

            box-shadow:
                0 8px 25px rgba(99, 102, 241, 0.20);

            font-size: 25px;
        }

        .brand h1 {
            font-size: 25px;
            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .brand p {
            margin-top: 7px;

            color: #94a3b8;

            font-size: 14px;
        }

        /* =========================
           AUTH CARD
        ========================= */

        .auth-card {
            background: rgba(15, 23, 42, 0.30);

            border: 1px solid #1e293b;

            border-radius: 16px;

            padding: 32px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .auth-card h2 {
            font-size: 22px;
            font-weight: 600;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        /* =========================
           ERROR
        ========================= */

        .error {
            background: rgba(239, 68, 68, 0.10);

            border: 1px solid rgba(239, 68, 68, 0.25);

            color: #fca5a5;

            padding: 11px 13px;

            border-radius: 9px;

            font-size: 13px;

            margin-bottom: 18px;
        }

        /* =========================
           FORM FIELD
        ========================= */

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            font-size: 12px;

            color: #94a3b8;

            margin-bottom: 8px;
        }

        .field > input {
            width: 100%;

            height: 43px;

            padding: 10px 13px;

            border-radius: 12px;

            background: #020617;

            border: 1px solid #1e293b;

            color: #f8fafc;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .field > input::placeholder {
            color: #64748b;
        }

        .field > input:hover {
            border-color: #334155;
        }

        .field > input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.13);
        }

        /* =========================
           PASSWORD
        ========================= */

        .password-wrapper {
            position: relative;

            width: 100%;
        }

        .password-wrapper input {
            width: 100%;

            height: 43px;

            padding: 10px 45px 10px 13px;

            border-radius: 12px;

            background: #020617;

            border: 1px solid #1e293b;

            color: #f8fafc;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .password-wrapper input::placeholder {
            color: #64748b;
        }

        .password-wrapper input:hover {
            border-color: #334155;
        }

        .password-wrapper input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.13);
        }

        .toggle-password {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 28px;
            height: 28px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 7px;

            background: transparent;

            color: #64748b;

            cursor: pointer;

            font-size: 16px;

            padding: 0;
        }

        .toggle-password:hover {
            color: #cbd5e1;

            background: rgba(148, 163, 184, 0.08);
        }

        .toggle-password:focus {
            outline: none;

            box-shadow:
                0 0 0 2px rgba(99, 102, 241, 0.20);
        }

        /* =========================
           SIGN IN BUTTON
        ========================= */

        .submit-btn {
            width: 100%;

            height: 43px;

            border: none;

            border-radius: 12px;

            margin-top: 4px;

            background: #6366f1;

            color: #ffffff;

            font-family: inherit;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }

        .submit-btn:hover {
            background: #818cf8;

            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:focus {
            outline: none;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.20);
        }

        /* =========================
           SIGNUP LINK
        ========================= */

        .bottom-text {
            text-align: center;

            margin-top: 24px;

            padding-top: 22px;

            border-top: 1px solid #1e293b;

            color: #94a3b8;

            font-size: 13px;
        }

        .bottom-text a {
            color: #a5b4fc;

            text-decoration: none;

            font-weight: 600;
        }

        .bottom-text a:hover {
            color: #818cf8;

            text-decoration: underline;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            margin-top: 22px;

            color: #475569;

            font-size: 11px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .auth-card {
                padding: 25px 21px;
            }

            .brand {
                margin-bottom: 22px;
            }
        }
    </style>
</head>

<body>

<div class="auth-wrapper">

    <!-- =========================
         BRAND
    ========================= -->

    <div class="brand">

        <div class="brand-icon">
            🎙️
        </div>

        <h1>
            TTS-DAI
        </h1>

        <p>
            AI Voice & Text-to-Speech Studio
        </p>

    </div>


    <!-- =========================
         LOGIN CARD
    ========================= -->

    <div class="auth-card">

        <h2>
            Welcome Back
        </h2>

        <p class="subtitle">
            Sign in to continue to your TTS-DAI workspace.
        </p>


        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}


        <!-- =========================
             LOGIN FORM
        ========================= -->

        <form method="post" action="/login">

            <!-- Username / Email -->

            <div class="field">

                <label for="login">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="Enter your username or email"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <!-- Password -->

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password"
                        title="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- Sign In -->

            <button
                type="submit"
                class="submit-btn"
            >
                Sign In
            </button>

        </form>


        <!-- =========================
             SIGNUP
        ========================= -->

        <div class="bottom-text">

            Don't have an account?

            <a href="/signup">
                Signup
            </a>

        </div>

    </div>


    <!-- Footer -->

    <div class="footer">
        TTS-DAI • AI Voice Studio
    </div>

</div>


<!-- =========================
     PASSWORD VISIBILITY
========================= -->

<script>

function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

        button.setAttribute(
            "title",
            "Hide password"
        );

    } else {

        input.type = "password";

        button.textContent = "👁";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

        button.setAttribute(
            "title",
            "Show password"
        );
    }
}

</script>

</body>
</html>
